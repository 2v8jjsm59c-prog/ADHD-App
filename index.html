<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cut">
<title>Tiny Wins</title>
<meta name="theme-color" content="#14161c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tiny Wins">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  --bg: #14161c;
  --surface: #1e212a;
  --surface-2: #272b36;
  --text: #eef0f5;
  --muted: #9aa1b2;
  --line: #333846;
  --accent: #7c5cff;
  --accent-2: #00d4a6;
  --warn: #ffb547;
  --danger: #ff5c7a;
  --radius: 14px;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f5f6fa;
    --surface: #ffffff;
    --surface-2: #eceef4;
    --text: #1a1d26;
    --muted: #626a7d;
    --line: #dde0e8;
  }
}
* { box-sizing: border-box; }
html { height: 100%; }
body { margin: 0; min-height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-tap-highlight-color: transparent;
  padding-bottom: calc(84px + env(safe-area-inset-bottom));
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
input { font: inherit; color: inherit; }
.wrap { max-width: 560px; margin: 0 auto; padding: calc(12px + env(safe-area-inset-top)) 16px 16px; }

/* Header / progress */
.top { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.ring-mini { width: 46px; height: 46px; flex: none; }
.top-text { flex: 1; min-width: 0; }
.top-text b { display: block; font-size: 15px; }
.top-text span { color: var(--muted); font-size: 13px; }
.level { font-size: 12px; color: var(--muted); text-align: right; }
.level b { color: var(--text); font-size: 15px; display: block; }
.xpbar { height: 4px; border-radius: 4px; background: var(--surface-2); margin-top: 4px; width: 70px; overflow: hidden; }
.xpbar i { display: block; height: 100%; background: var(--accent); transition: width .5s; }

/* Capture */
.capture { display: flex; gap: 8px; margin-bottom: 16px; }
.capture input {
  flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 14px 16px; outline: none;
}
.capture input:focus { border-color: var(--accent); }
.btn {
  background: var(--accent); color: #fff; border-radius: var(--radius);
  padding: 12px 18px; font-weight: 600;
}
.btn.ghost { background: var(--surface-2); color: var(--text); }
.btn.green { background: var(--accent-2); color: #062b23; }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .5; }

/* Sections & tasks */
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 4px 8px; display: flex; justify-content: space-between; }
h2 small { text-transform: none; letter-spacing: 0; }
.empty { color: var(--muted); padding: 14px; text-align: center; font-size: 14px; border: 1px dashed var(--line); border-radius: var(--radius); }
.task { background: var(--surface); border-radius: var(--radius); margin-bottom: 8px; overflow: hidden; }
.task-row { display: flex; align-items: center; gap: 10px; padding: 12px; }
.check {
  width: 28px; height: 28px; flex: none; border-radius: 50%; border: 2px solid var(--muted);
  display: grid; place-items: center; transition: all .2s;
}
.check:hover { border-color: var(--accent-2); }
.check.done { background: var(--accent-2); border-color: var(--accent-2); }
.task-title { flex: 1; min-width: 0; word-wrap: break-word; }
.task-meta { font-size: 12px; color: var(--muted); }
.icon-btn { padding: 6px 8px; border-radius: 10px; color: var(--muted); font-size: 18px; line-height: 1; }
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.star.on { color: var(--warn); }
.mini-prog { height: 3px; background: var(--surface-2); }
.mini-prog i { display: block; height: 100%; background: var(--accent-2); transition: width .4s; }
.steps { border-top: 1px solid var(--line); padding: 8px 12px 12px; background: var(--surface); }
.step { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
.step .check { width: 22px; height: 22px; }
.step.done .step-title { text-decoration: line-through; color: var(--muted); }
.step-title { flex: 1; font-size: 15px; }
.add-step { display: flex; gap: 6px; margin-top: 6px; }
.add-step input { flex: 1; min-width: 0; background: var(--surface-2); border: 0; border-radius: 10px; padding: 9px 12px; outline: none; font-size: 15px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { background: var(--surface-2); border-radius: 999px; padding: 5px 11px; font-size: 13px; color: var(--muted); }
.chip:hover { color: var(--text); }
.task-actions { display: flex; gap: 8px; margin-top: 10px; }
.task-actions .btn { padding: 9px 14px; font-size: 14px; }
.hint { font-size: 13px; color: var(--muted); margin: 4px 0 2px; }

/* Focus */
.focus { text-align: center; padding-top: 8px; }
.focus .parent { color: var(--muted); font-size: 14px; margin-bottom: 6px; }
.focus .now { font-size: 26px; font-weight: 700; line-height: 1.25; margin: 0 0 18px; word-wrap: break-word; }
.timer { position: relative; width: 230px; height: 230px; margin: 0 auto 18px; }
.timer svg { transform: rotate(-90deg); }
.timer .t { position: absolute; inset: 0; display: grid; place-items: center; font-size: 46px; font-weight: 700; font-variant-numeric: tabular-nums; }
.timer .t small { display: block; font-size: 13px; font-weight: 500; color: var(--muted); }
.durations { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.durations button { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 64px; }
.durations button b { display: block; font-size: 18px; }
.durations button span { font-size: 11px; color: var(--muted); }
.durations button:hover { border-color: var(--accent); }
.focus-actions { display: flex; flex-direction: column; gap: 8px; max-width: 340px; margin: 0 auto; }
.focus-actions .row { display: flex; gap: 8px; }
.focus-actions .row .btn { flex: 1; }
.big-done { font-size: 20px; padding: 16px; }
.startcard { background: linear-gradient(135deg, var(--accent), #5a3ee0); color: #fff; border-radius: 18px; padding: 16px; margin-bottom: 14px; }
.sc-label { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; opacity: .8; }
.sc-what { font-size: 22px; font-weight: 700; margin: 4px 0 2px; word-wrap: break-word; }
.sc-from { font-size: 13px; opacity: .85; margin-bottom: 12px; }
.startcard .sc-go { width: 100%; background: #fff; color: #3a22b8; }
.startcard .row { display: flex; gap: 8px; margin-top: 8px; }
.startcard .row .btn { flex: 1; background: rgba(255,255,255,.18); color: #fff; font-size: 14px; padding: 10px; }
.listbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: -8px 4px -6px; min-height: 34px; }
.searchbar { display: flex; gap: 8px; margin: -6px 0 14px; }
.searchbar input { flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--accent); border-radius: var(--radius); padding: 11px 14px; outline: none; font-size: 16px; }
.searchbar .btn { padding: 10px 14px; }
.listbar .left { display: flex; gap: 14px; }
.linkbtn, .sortbar { white-space: nowrap; }
.sortbar select { max-width: 150px; }
mark { background: rgba(255,181,71,.45); color: inherit; border-radius: 3px; padding: 0 1px; }
.linkbtn { color: var(--accent); font-size: 14px; font-weight: 600; padding: 6px 0; }
.sortbar { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.overlay .card.bulk { text-align: left; max-width: 480px; max-height: calc(100vh - 32px); overflow: auto; }
.bulk h3 { text-align: center; }
.bulk textarea { width: 100%; min-height: 150px; background: var(--surface-2); color: var(--text); border: 1px solid var(--line); border-radius: 12px; padding: 12px; font: inherit; font-size: 16px; resize: vertical; outline: none; }
.bulk textarea:focus { border-color: var(--accent); }
.bulk .hint { margin: 0 0 10px; }
.bulk .preview { margin: 10px 0 4px; font-size: 14px; max-height: 180px; overflow: auto; }
.bulk .preview .pt { padding: 3px 0; }
.bulk .preview .ps { padding: 2px 0 2px 18px; color: var(--muted); }
.bulk .count { font-size: 13px; color: var(--muted); }
.bulk .file { display: inline-block; margin-top: 8px; }
.sortbar select { background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; font: inherit; }
.badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
.badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.badge.hot { background: rgba(255,92,122,.16); color: var(--danger); }
.badge.warm { background: rgba(255,181,71,.18); color: #c47d00; }
.badge.good { background: rgba(0,212,166,.16); color: #00936f; }
.rate { display: grid; grid-template-columns: 84px 1fr; gap: 6px 8px; align-items: center; margin: 4px 0 12px; font-size: 13px; color: var(--muted); }
.seg { display: flex; background: var(--surface-2); border-radius: 10px; padding: 3px; }
.seg button { flex: 1; padding: 6px 4px; font-size: 13px; border-radius: 8px; color: var(--muted); }
.seg button.on { background: var(--accent); color: #fff; }
.focus .chips { justify-content: center; }
.focus .add-step { max-width: 380px; margin: 0 auto; }
.focus .add-step input { background: var(--surface); padding: 13px 14px; font-size: 16px; }
.overlay.launch { display: flex; flex-direction: column; align-items: center; justify-content: center; background: #1c1640; color: #fff; text-align: center; }
.launch p { font-size: 18px; margin: 0 0 6px; opacity: .85; }
.launch .count { font-size: 120px; font-weight: 800; line-height: 1; }
.nudge { background: var(--surface); border-radius: var(--radius); padding: 14px; margin: 0 auto 14px; max-width: 340px; font-size: 15px; }

/* Wins */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.stat { background: var(--surface); border-radius: var(--radius); padding: 14px 8px; text-align: center; }
.stat b { display: block; font-size: 24px; }
.stat span { font-size: 12px; color: var(--muted); }
.log-item { display: flex; gap: 10px; padding: 10px 12px; background: var(--surface); border-radius: 12px; margin-bottom: 6px; font-size: 15px; }
.log-item .when { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
.log-item .sub { color: var(--muted); font-size: 12px; }
.settings { display: flex; flex-direction: column; gap: 10px; background: var(--surface); padding: 14px; border-radius: var(--radius); }
.settings label { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.settings select, .settings input[type=number] { background: var(--surface-2); border: 0; border-radius: 8px; padding: 6px 8px; color: var(--text); }

/* Nav */
nav {
  position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface);
  border-top: 1px solid var(--line); display: flex; justify-content: center;
  padding-bottom: env(safe-area-inset-bottom); z-index: 5;
}
nav button { flex: 1; max-width: 186px; padding: 10px 0 12px; color: var(--muted); font-size: 12px; }
nav button .ico { display: block; font-size: 22px; margin-bottom: 2px; }
nav button.active { color: var(--accent); }
nav button.focus-btn .ico { background: var(--accent); color: #fff; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; margin: -18px auto 2px; box-shadow: 0 4px 14px rgba(124,92,255,.5); }

/* Celebration */
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 20; }
.toast {
  position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px);
  background: var(--text); color: var(--bg); padding: 12px 18px; border-radius: 999px; font-weight: 600;
  opacity: 0; transition: all .3s; z-index: 21; display: flex; gap: 12px; align-items: center; max-width: calc(100% - 32px);
}
.toast { pointer-events: none; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
.toast button { color: var(--accent); font-weight: 700; }
.xp-float { position: fixed; z-index: 22; font-weight: 800; color: var(--accent-2); font-size: 22px; pointer-events: none; animation: floatUp 1.1s ease-out forwards; }
@keyframes floatUp { from { opacity: 1; transform: translate(-50%, 0) scale(1); } to { opacity: 0; transform: translate(-50%, -70px) scale(1.4); } }
.pop { animation: pop .4s ease; }
@keyframes pop { 50% { transform: scale(1.25); } }
.overlay { position: fixed; inset: 0; background: rgba(10,10,20,.7); display: grid; place-items: center; z-index: 19; padding: 16px; }
.overlay .card { background: var(--surface); border-radius: 20px; padding: 26px 22px; text-align: center; max-width: 360px; width: 100%; animation: pop .45s ease; }
.overlay .card .emoji { font-size: 56px; }
.overlay .card h3 { margin: 6px 0 4px; font-size: 22px; }
.overlay .card p { color: var(--muted); margin: 0 0 18px; }
.overlay .card .btn { width: 100%; margin-top: 8px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<canvas id="confetti"></canvas>

<div class="wrap">
  <header class="top">
    <svg class="ring-mini" viewBox="0 0 46 46" aria-hidden="true">
      <circle cx="23" cy="23" r="19" fill="none" stroke="var(--surface-2)" stroke-width="6"/>
      <circle id="goalRing" cx="23" cy="23" r="19" fill="none" stroke="var(--accent-2)" stroke-width="6"
        stroke-linecap="round" stroke-dasharray="119.4" stroke-dashoffset="119.4" transform="rotate(-90 23 23)" style="transition: stroke-dashoffset .6s"/>
    </svg>
    <div class="top-text">
      <b id="goalText">0 of 3 wins today</b>
      <span id="streakText">Start a streak today</span>
    </div>
    <div class="level"><b id="levelText">Lv 1</b><div class="xpbar"><i id="xpBar" style="width:0"></i></div></div>
  </header>

  <!-- TASKS VIEW -->
  <section id="view-tasks">
    <div class="startcard" id="startCard" hidden></div>
    <form class="capture" id="captureForm" autocomplete="off">
      <input id="captureInput" placeholder="Brain dump: what's on your mind?" enterkeyhint="done" aria-label="New task">
      <button class="btn" type="submit">Add</button>
    </form>
    <div class="searchbar" id="searchBar" hidden>
      <input id="searchInput" type="text" placeholder="Search tasks, steps and done items" aria-label="Search" enterkeyhint="search" autocomplete="off">
      <button class="btn ghost" id="searchClose" type="button" aria-label="Close search">✕</button>
    </div>
    <div class="listbar">
      <div class="left">
        <button class="linkbtn" id="bulkBtn" type="button">📋 Paste a list</button>
        <button class="linkbtn" id="searchBtn" type="button">🔍 Search</button>
      </div>
      <div class="sortbar" id="sortBar">Sort by
        <select id="sortSelect" aria-label="Sort tasks"></select>
      </div>
    </div>
    <h2 id="todayHead">Today <small id="todayCount"></small></h2>
    <div id="todayList"></div>
    <h2 id="restHead">Everything else <small id="restCount"></small></h2>
    <div id="restList"></div>
    <div id="doneResults" hidden>
      <h2>Already done <small id="doneCount"></small></h2>
      <div id="doneList"></div>
    </div>
  </section>

  <!-- FOCUS VIEW -->
  <section id="view-focus" hidden>
    <div class="focus" id="focusRoot"></div>
  </section>

  <!-- WINS VIEW -->
  <section id="view-wins" hidden>
    <div class="stats">
      <div class="stat"><b id="statToday">0</b><span>wins today</span></div>
      <div class="stat"><b id="statStarts">0</b><span>starts today</span></div>
      <div class="stat"><b id="statStreak">0</b><span>day streak</span></div>
      <div class="stat"><b id="statTotal">0</b><span>total wins</span></div>
    </div>
    <h2>Done list <small>proof you're getting stuff done</small></h2>
    <div id="logList"></div>
    <h2>Settings</h2>
    <div class="settings">
      <label>Daily win goal <input type="number" id="setGoal" min="1" max="20"></label>
      <label>Sounds <select id="setSound"><option value="1">On</option><option value="0">Off</option></select></label>
      <div class="row" style="display:flex;gap:8px">
        <button class="btn ghost" id="exportBtn" style="flex:1">Export backup</button>
        <button class="btn ghost" id="importBtn" style="flex:1">Import</button>
        <input type="file" id="importFile" accept="application/json" hidden>
      </div>
    </div>
  </section>
</div>

<nav>
  <button data-view="tasks" class="active"><span class="ico">☰</span>Tasks</button>
  <button data-view="focus" class="focus-btn"><span class="ico">▶</span>Focus</button>
  <button data-view="wins"><span class="ico">★</span>Wins</button>
</nav>

<div class="toast" id="toast"></div>
<div id="overlayRoot"></div>

<script>
(() => {
'use strict';

// ---------- State ----------
const KEY = 'tinywins.v1';
const TODAY_MAX = 3;
const XP = { step: 10, task: 25, effort: 3, start: 5 };
const DURATIONS = [
  { m: 2, label: 'just start' },
  { m: 5, label: 'quick' },
  { m: 10, label: 'short' },
  { m: 15, label: 'solid' },
  { m: 25, label: 'deep' },
];
const STARTERS = [
  'Open / find what I need',
  'Write down what "done" looks like',
  'Do the first 2 minutes',
  'Send the message / email',
  'Make the call',
  'Ask someone for help',
];
// Optional ratings per task. Unrated counts as the middle value (2).
const CRITERIA = [
  { key: 'imp', label: 'Importance', opts: ['Low', 'Medium', 'High'],
    badge: { 3: ['❗ Important', 'hot'] } },
  { key: 'urg', label: 'Urgency', opts: ['Whenever', 'This week', 'ASAP'],
    badge: { 3: ['⏰ ASAP', 'hot'], 2: ['📅 This week', 'warm'] } },
  { key: 'effort', label: 'Effort', opts: ['Quick', 'Medium', 'Big'],
    badge: { 1: ['⚡ Quick', 'good'], 3: ['🐘 Big', ''] } },
];
const rating = (t, k) => t[k] || 2;
const ageDays = t => (Date.now() - t.created) / 864e5;
// Higher score = higher in the list.
const SORTS = {
  smart: { label: 'Smart', score: t => 3 * rating(t, 'imp') + 3 * rating(t, 'urg') + 1.5 * (4 - rating(t, 'effort')) + Math.min(ageDays(t), 14) * 0.1 },
  imp: { label: 'Most important', score: t => rating(t, 'imp') },
  urg: { label: 'Most urgent', score: t => rating(t, 'urg') },
  easy: { label: 'Easiest first', score: t => 4 - rating(t, 'effort') },
  quickwins: { label: 'Quick wins (important + easy)', score: t => rating(t, 'imp') + (4 - rating(t, 'effort')) },
  oldest: { label: 'Oldest first', score: t => -t.created },
  newest: { label: 'Newest first', score: t => t.created },
};
function sortTasks(list, key = state.settings.sort) {
  const primary = (SORTS[key] || SORTS.smart).score, tie = SORTS.smart.score;
  return [...list].sort((a, b) => (primary(b) - primary(a)) || (tie(b) - tie(a)));
}

const FIRST_MOVES = [
  'Open the laptop / app',
  'Find the document',
  'Pick up the phone',
  'Write one messy sentence',
  'Put the thing in front of me',
  'Stand up and go to it',
];
const START_PRAISE = [
  'You started. That\'s the hard bit done.', 'Launched 🚀', 'Starting is the win. Go!', 'Engines on.',
];
const PRAISE = [
  'Boom. Done.', 'That\'s momentum.', 'Look at you go!', 'One less thing in your head.',
  'Nailed it.', 'Small step, real progress.', 'Future you says thanks.', 'Crushed it.',
  'Brain: satisfied.', 'Keep that streak alive!',
];
const EFFORT_PRAISE = [
  'Showing up counts. Seriously.', 'You started. That\'s the hard part.', 'Progress, not perfection.',
];

const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const dayKey = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

function defaultState() {
  return {
    tasks: [],
    log: [],
    xp: 0,
    streak: { last: null, count: 0 },
    settings: { goal: 3, sound: true, sort: 'smart' },
    focus: null, // { taskId, stepId, endAt, minutes, expired }
  };
}

let state;
try { state = Object.assign(defaultState(), JSON.parse(localStorage.getItem(KEY)) || {}); }
catch { state = defaultState(); }
state.settings = Object.assign(defaultState().settings, state.settings);

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {}
}

// ---------- Helpers ----------
const $ = sel => document.querySelector(sel);
function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') n.className = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (k === 'text') n.textContent = v;
    else if (v !== false && v != null) n.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null) n.append(k);
  return n;
}
const findTask = id => state.tasks.find(t => t.id === id);
const nextStep = t => t.steps.find(s => !s.done);
const winsToday = () => state.log.filter(l => l.day === dayKey() && l.kind !== 'start').length;
const startsToday = () => state.log.filter(l => l.day === dayKey() && l.kind === 'start').length;
const level = () => Math.floor(state.xp / 100) + 1;

let expanded = new Set();
let view = 'tasks';

// ---------- Rewards ----------
function bumpStreak() {
  const today = dayKey();
  if (state.streak.last === today) return;
  const y = new Date(); y.setDate(y.getDate() - 1);
  state.streak.count = state.streak.last === dayKey(y) ? state.streak.count + 1 : 1;
  state.streak.last = today;
}
function currentStreak() {
  const y = new Date(); y.setDate(y.getDate() - 1);
  return (state.streak.last === dayKey() || state.streak.last === dayKey(y)) ? state.streak.count : 0;
}

function award(kind, title, parent, originEl) {
  const before = winsToday();
  const oldLevel = level();
  const pts = XP[kind];
  state.xp += pts;
  if (kind !== 'effort') {
    state.log.unshift({ id: uid(), title, parent: parent || null, kind, at: Date.now(), day: dayKey(), xp: pts });
    state.log = state.log.slice(0, 500);
    bumpStreak();
  }
  save();

  floatXP(pts, originEl);
  const big = kind === 'task';
  confetti(big ? 160 : kind === 'step' ? 70 : kind === 'start' ? 45 : 25);
  chime(big ? 'big' : kind === 'effort' ? 'soft' : 'small');
  if (navigator.vibrate) navigator.vibrate(big ? [30, 40, 60] : 25);

  const hitGoal = (kind === 'step' || kind === 'task') && before < state.settings.goal && winsToday() >= state.settings.goal;
  if (level() > oldLevel) {
    setTimeout(() => celebrate('🏆', `Level ${level()}!`, 'You levelled up. Keep stacking wins.'), 500);
  } else if (hitGoal) {
    setTimeout(() => { confetti(220); celebrate('🎯', 'Daily goal hit!', `${state.settings.goal} wins today. Anything else is bonus.`); }, 500);
  } else {
    toast(kind === 'effort' ? pick(EFFORT_PRAISE) : kind === 'start' ? pick(START_PRAISE) : pick(PRAISE));
  }

function floatXP(pts, originEl) {

// Sound (Web Audio, no files needed)
let actx;
function chime(type) {
  if (!state.settings.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const notes = { big: [523, 659, 784, 1047], small: [659, 988], soft: [523], tick: [880], alarm: [784, 784, 784] }[type];
    notes.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type === 'alarm' ? 'square' : 'triangle';
      o.frequency.value = f;
      const t0 = actx.currentTime + i * (type === 'alarm' ? 0.25 : 0.09);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(type === 'alarm' ? 0.08 : 0.2, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.35);
      o.connect(g).connect(actx.destination);
      o.start(t0); o.stop(t0 + 0.4);
    });
  } catch {}
}

// Confetti
const cv = $('#confetti'), cx = cv.getContext('2d');
let parts = [], raf = null;
function confetti(n) {
  cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio;
  cx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  const colors = ['#7c5cff', '#00d4a6', '#ffb547', '#ff5c7a', '#4cc9f0', '#ffffff'];
  for (let i = 0; i < n; i++) {
    parts.push({
      x: innerWidth / 2 + (Math.random() - .5) * 80, y: innerHeight * 0.45,
      vx: (Math.random() - .5) * 16, vy: -Math.random() * 16 - 4,
      r: Math.random() * 6 + 4, c: pick(colors), rot: Math.random() * 6, vr: (Math.random() - .5) * .4, life: 0,
    });
  }
  if (!raf) raf = requestAnimationFrame(tick);
}
function tick() {
  cx.clearRect(0, 0, innerWidth, innerHeight);
  parts = parts.filter(p => p.y < innerHeight + 20 && p.life < 240);
  for (const p of parts) {
    p.vy += 0.45; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life++;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot); cx.fillStyle = p.c;
    cx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); cx.restore();
  }
  raf = parts.length ? requestAnimationFrame(tick) : (cx.clearRect(0, 0, innerWidth, innerHeight), null);
}

function addTask(title) {

// Turn pasted text into tasks. One task per line; lines indented under a task
// (or bulleted under an un-bulleted heading) become its steps. Ticked items are skipped.
const BULLET = /^(?:[-*•◦▪‣–—+]|\d{1,3}[.)]|[a-z][.)](?=\s)|\[[ xX✓✔]?\]|[☐☑☒✓✔✗○●□■◯⬜✅])\s*/;
const DONE_MARK = /^(?:\[[xX✓✔]\]|[☑☒✓✔✅])/;
function parseList(text) {
  const out = [];
  let current = null, currentIndent = 0, currentBulleted = false;
  for (const raw of text.split(/\r?\n/)) {
    if (!raw.trim()) continue;
    const indent = raw.match(/^[ \t\u00a0]*/)[0].replace(/\t/g, '    ').length;
    let line = raw.trim(), bulleted = false, done = false;
    for (let i = 0; i < 3 && BULLET.test(line); i++) { // handles "- [ ] task"
      if (DONE_MARK.test(line)) done = true;
      line = line.replace(BULLET, '');
      bulleted = true;
    }
    line = line.replace(/:$/, '').trim().slice(0, 200);
    if (!line || done) continue;
    const isStep = current && (indent > currentIndent || (bulleted && !currentBulleted));
    if (isStep) current.steps.push(line);
    else {
      current = { title: line, steps: [] };
      currentIndent = indent; currentBulleted = bulleted;
      out.push(current);
    }
  }
  return out.slice(0, 200);
}

function addParsed(items) {
  const now = Date.now();
  // Keep the pasted order at the top of the list.
  const tasks = items.map((it, i) => ({
    id: uid(), title: it.title, created: now - i, today: false,
    steps: it.steps.map(st => ({ id: uid(), title: st, done: false })),
  }));
  state.tasks.unshift(...tasks);
  save(); render();
}

// ---------- Search ----------
let query = '';
const norm = str => str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const queryWords = () => norm(query).split(/\s+/).filter(Boolean);
// Every word must appear somewhere in the task's title or its steps.
function matchesTask(t, words) {
  const hay = norm([t.title, ...t.steps.map(x => x.title)].join(' '));
  return words.every(w => hay.includes(w));
}
// Text with matched words wrapped in <mark>, built as nodes (no innerHTML).
function hl(text, words = queryWords()) {
  if (!words.length) return [text];
  const n = norm(text);
  const hits = [];
  for (const w of words) for (let i = n.indexOf(w); i >= 0; i = n.indexOf(w, i + 1)) hits.push([i, i + w.length]);
  if (!hits.length) return [text];
  hits.sort((a, b) => a[0] - b[0]);
  const out = [];
  let pos = 0;
  for (const [a, b] of hits) {
    if (b <= pos) continue;
    const start = Math.max(a, pos);
    if (start > pos) out.push(text.slice(pos, start));
    out.push(el('mark', { text: text.slice(start, b) }));
    pos = b;
  }
  if (pos < text.length) out.push(text.slice(pos));
  return out;
}

function badgesFor(t) {
  const b = CRITERIA.map(c => c.badge[t[c.key]]).filter(Boolean);
  return b.length ? el('div', { class: 'badges' }, b.map(([text, cls]) => el('span', { class: 'badge ' + cls, text }))) : null;
}

  const meta = stepHit ? ['Step: ', ...hl(stepHit.title, words)]

let focusStepInput = null;
function renderTasks() {
  const words = queryWords();
  const searching = words.length > 0;
  $('#startCard').hidden = true;
  if (!searching) renderStartCard();
  const sorted = sortTasks(searching ? state.tasks.filter(t => matchesTask(t, words)) : state.tasks);
  const today = sorted.filter(t => t.today);
  const rest = sorted.filter(t => !t.today);

  $('#restCount').textContent = rest.length ? rest.length : '';

  // While searching, hide empty sections; if nothing matches at all, say so once.

  $('#restHead').hidden = $('#restList').hidden = searching && !rest.length && !!today.length;

    : [searching ? noMatch : el('div', { class: 'empty', text: state.tasks.length ? 'Star ☆ up to 3 things that matter today.' : 'Nothing here yet. Dump everything above, no sorting needed.' })]));
  $('#restList').replaceChildren(...(rest.length ? rest.map(taskCard) : [searching ? noMatch.cloneNode(true) : el('div', { class: 'empty', text: 'Inbox zero. Nice.' })]));

  // While searching, also show matching finished items ("did I already do that?").
  const done = searching ? state.log.filter(l => l.kind !== 'start' && words.every(w => norm(l.title + ' ' + (l.parent || '')).includes(w))) : [];
  $('#doneResults').hidden = !searching || !done.length;

  $('#doneList').replaceChildren(...(done.length ? done.slice(0, 30).map(l => el('div', { class: 'log-item' },
    el('span', { text: l.kind === 'task' ? '🏁' : '✅' }),

    el('span', { class: 'when', text: when(l.at) })))
    : [el('div', { class: 'empty', text: 'Nothing finished matches.' })]));

    if (inp) inp.focus();

// ---------- Focus mode ----------
let timerInt = null;

// Today's tasks first, then in the order of the chosen sort.
function candidates() {
  const sorted = sortTasks(state.tasks);
  return [...sorted.filter(t => t.today), ...sorted.filter(t => !t.today)];
}
function pickForMe() {
  const c = candidates();
  return c.length ? pick(c.slice(0, 3)) : null;
}

function setFocus(taskId) {
  const t = findTask(taskId);
  if (!t) return;
  if (state.focus && state.focus.taskId === taskId) return;
  const s = nextStep(t);
  state.focus = { taskId, stepId: s ? s.id : null, endAt: null, minutes: null, expired: false };
  save();
}

function startFocusOn(taskId) {
  setFocus(taskId);
  go('focus');
}

// Insert a new step just before the current one and make it the focus.
function addFirstMove(t, title) {
  const step = { id: uid(), title, done: false };
  const idx = t.steps.findIndex(x => !x.done);
  t.steps.splice(idx < 0 ? t.steps.length : idx, 0, step);
  Object.assign(state.focus, { stepId: step.id, askFirst: false });
  save();
}

// 3-2-1 countdown, then start the timer and reward the start itself.
function launch(minutes, taskId) {
  if (taskId) setFocus(taskId);
  if (!state.focus) return;
  state.focus.skipFirst = true;
  state.focus.askFirst = false;
  save();
  if (view !== 'focus') go('focus');
  countdown(() => {
    startTimer(minutes);
    if (!state.focus.started) {
      state.focus.started = true;
      const { t, s } = focusTarget();
      award('start', s ? s.title : t.title, s ? t.title : null);
    }
  });
}

function countdown(done) {
  const root = $('#overlayRoot');
  let n = 3;
  const num = el('div', { class: 'count pop', text: n });
  root.replaceChildren(el('div', { class: 'overlay launch' }, el('p', { text: 'Hands on it…' }), num));
  chime('tick');
  const iv = setInterval(() => {
    n--;
    if (n >= 0) {
      num.textContent = n ? n : 'GO!';
      num.classList.remove('pop'); void num.offsetWidth; num.classList.add('pop');
      if (n) chime('tick');
    } else {
      clearInterval(iv);
      root.replaceChildren();
      done();
    }
  }, 700);
}

function stuck() {
  const { t } = focusTarget();
  celebrate('🧱', 'What\'s getting in the way?', 'Pick the closest one. There are no wrong answers.', [
    { label: '🐘 It feels too big', cls: 'btn ghost', fn: () => { state.focus.askFirst = true; save(); go('focus'); } },
    { label: '🤷 Not sure where to begin', cls: 'btn ghost', fn: () => { addFirstMove(t, 'Spend 2 min working out the first move'); launch(2); } },
    { label: '😬 I\'m dreading it', cls: 'btn ghost', fn: () => { toast('Just 2 minutes. You\'re allowed to stop after.'); launch(2); } },
    { label: '🥱 It\'s boring', cls: 'btn ghost', fn: () => { toast('Race the clock. Music on.'); launch(10); } },
    { label: '🪫 No energy. Give me an easy one', cls: 'btn ghost', fn: () => {
      const easy = sortTasks(state.tasks.filter(x => x.id !== t.id), 'easy')[0];
      state.focus = null; save();
      if (easy) { startFocusOn(easy.id); toast('Here\'s an easier one. Still counts.'); } else { startIdx++; go('tasks'); }
    } },
  ]);
}

function startTimer(minutes) {
  state.focus.minutes = minutes;
  state.focus.endAt = Date.now() + minutes * 60000;
  state.focus.expired = false;
  chime('soft');
  save(); renderFocus();
}

function focusTarget() {
  const f = state.focus;
  if (!f) return null;
  const t = findTask(f.taskId);
  if (!t) { state.focus = null; return null; }
  const s = f.stepId ? t.steps.find(x => x.id === f.stepId && !x.done) : null;
  if (f.stepId && !s) { // step was completed elsewhere: move to next
    const n = nextStep(t); f.stepId = n ? n.id : null;
    return { t, s: n || null };
  }
  return { t, s };
}

function focusDone(originEl) {
  const { t, s } = focusTarget();
  clearInterval(timerInt);
  if (s) {
    s.done = true;
    award('step', s.title, t.title, originEl);
    const n = nextStep(t);
    if (n) {
      state.focus = { taskId: t.id, stepId: n.id, endAt: null, minutes: null, expired: false };
      save(); renderFocus();
      setTimeout(() => celebrate('✅', 'Step done!', `Next up: "${n.title}"`, [
        { label: 'Keep rolling', cls: 'btn', fn: () => {} },
        { label: 'Take a 5 min break', cls: 'btn ghost', fn: () => { state.focus = null; save(); go('tasks'); toast('Break earned. Come back after ☕'); } },
      ]), 600);
    } else {
      state.focus = { taskId: t.id, stepId: null, endAt: null, minutes: null, expired: false };
      save(); renderFocus();
      setTimeout(() => celebrate('🎉', 'Every step done!', `Is "${t.title}" finished?`, [
        { label: 'Yes! Tick it off', cls: 'btn green', fn: () => { state.focus = null; completeTask(t.id); renderFocus(); } },
        { label: 'Not yet. What\'s next?', cls: 'btn ghost', fn: () => { state.focus = { taskId: t.id, stepId: null, endAt: null, minutes: null, expired: false, askFirst: true }; save(); renderFocus(); } },
      ]), 600);
    }
  } else {
    state.focus = null;
    completeTask(t.id, originEl);
    renderFocus();
  }
}

function focusStop(withEffort) {
  clearInterval(timerInt);
  state.focus = null;
  save();
  if (withEffort) award('effort', null, null);
  renderFocus();
}

function focusSplit() {
  const { t } = focusTarget();
  clearInterval(timerInt);
  state.focus = null; save();
  expanded.add(t.id);
  go('tasks');
  toast('Split it smaller. What\'s the very first move?');
}

function fmt(ms) {
  const sec = Math.max(0, Math.ceil(ms / 1000));
  return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
}

function renderFocus() {
  clearInterval(timerInt);
  const root = $('#focusRoot');
  const target = focusTarget();

  if (!target) {
    const today = state.tasks.filter(t => t.today);
    root.replaceChildren(
      el('p', { class: 'parent', text: 'Can\'t decide? That\'s normal.' }),
      el('div', { class: 'now', text: state.tasks.length ? 'Pick one thing. Just one.' : 'Add a task first, then come back here.' }),
      state.tasks.length ? el('div', { class: 'focus-actions' },
        el('button', { class: 'btn big-done', text: '🎲 Pick for me', onclick: () => { const t = pickForMe(); t && startFocusOn(t.id); } }),
        (today.length ? today : state.tasks.slice(0, 5)).map(t =>
          el('button', { class: 'btn ghost', text: t.title, onclick: () => startFocusOn(t.id) })),
      ) : el('button', { class: 'btn', text: 'Go to tasks', onclick: () => go('tasks') }),
    );
    return;
  }

  const { t, s } = target;
  const f = state.focus;
  const nowText = s ? s.title : t.title;
  const kids = [
    el('div', { class: 'parent', text: s ? `Part of: ${t.title}` : (t.steps.length ? 'Final check' : 'The whole thing') }),
    el('h1', { class: 'now', text: nowText }),
  ];

  if (!f.endAt && (f.askFirst || (!s && !t.steps.length && !f.skipFirst))) {
    // Vague tasks are hard to start: get a concrete first physical action.
    const inp = el('input', { placeholder: 'e.g. open the email draft', enterkeyhint: 'go', 'aria-label': 'First move' });
    const goFirst = title => {
      title = title.trim();
      if (!title) { inp.focus(); return; }
      addFirstMove(t, title);
      launch(2);
    };
    const question = !s && t.steps.some(x => x.done) ? 'Nice. What\'s the next physical move?'
      : f.askFirst ? 'Smaller. What\'s the very first physical move?' : 'What\'s the very first physical move?';
    root.replaceChildren(
      el('div', { class: 'parent', text: t.title }),
      el('h1', { class: 'now', text: question }),
      el('p', { class: 'hint', text: 'Something you could do in 2 minutes without thinking. Smaller than feels sensible.' }),
      el('form', { class: 'add-step', onsubmit: e => { e.preventDefault(); goFirst(inp.value); } },
        inp, el('button', { class: 'btn', type: 'submit', text: '🚀 Go' })),
      el('div', { class: 'chips' }, FIRST_MOVES.map(m => el('button', { class: 'chip', text: m, onclick: () => goFirst(m) }))),
      el('div', { class: 'focus-actions', style: 'margin-top:18px' },
        el('button', { class: 'btn ghost', text: 'Skip. Just start on the whole thing', onclick: () => { f.skipFirst = true; f.askFirst = false; save(); renderFocus(); } })),
    );
    return;
  }

  if (!f.endAt) {
    kids.push(
      el('div', { class: 'focus-actions' },
        el('button', { class: 'btn big-done', text: '🚀 Just start: 2 min', onclick: () => launch(2) })),
      el('p', { class: 'hint', text: 'or commit to longer:' }),
      el('div', { class: 'durations' }, DURATIONS.filter(d => d.m > 2).map(d =>
        el('button', { onclick: () => launch(d.m) }, el('b', { text: d.m + 'm' }), el('span', { text: d.label })))),
      el('div', { class: 'focus-actions' },
        el('div', { class: 'row' },
          el('button', { class: 'btn ghost', text: '🧱 I\'m stuck', onclick: stuck }),
          el('button', { class: 'btn ghost', text: '✓ Already done', onclick: e => focusDone(e.currentTarget) })),
        el('button', { class: 'btn ghost', text: '🎲 Something else', onclick: () => { state.focus = null; save(); renderFocus(); } })),
    );
    root.replaceChildren(...kids);
    return;
  }

  // running or expired timer
  const C = 2 * Math.PI * 100;
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', '0 0 230 230'); svg.setAttribute('width', '230'); svg.setAttribute('height', '230');
  svg.innerHTML = `<circle cx="115" cy="115" r="100" fill="none" stroke="var(--surface-2)" stroke-width="14"/>
    <circle id="tRing" cx="115" cy="115" r="100" fill="none" stroke="var(--accent)" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="0"/>`;
  const tText = el('div', { text: '' });
  const tSub = el('small', { text: '' });
  const timer = el('div', { class: 'timer' }, svg, el('div', { class: 't' }, el('div', {}, tText, tSub)));
  const actions = el('div', { class: 'focus-actions' });
  kids.push(timer, actions);
  root.replaceChildren(...kids);

  const total = f.minutes * 60000;
  const update = () => {
    const left = f.endAt - Date.now();
    const tr = svg.querySelector('#tRing');
    if (left <= 0) {
      clearInterval(timerInt);
      tText.textContent = '0:00'; tSub.textContent = 'time\'s up';
      tr.setAttribute('stroke-dashoffset', C); tr.setAttribute('stroke', 'var(--warn)');
      const justStarted = f.minutes === 2;
      if (!f.expired) { f.expired = true; save(); chime(justStarted ? 'small' : 'alarm'); if (navigator.vibrate) navigator.vibrate([200, 100, 200]); }
      if (justStarted) {
        tSub.textContent = 'you started!';
        actions.replaceChildren(
          el('div', { class: 'nudge', text: '🚀 That was the hard part. You\'ve got momentum now. Ride it?' }),
          el('button', { class: 'btn big-done', text: 'Keep going: 10 min', onclick: () => startTimer(10) }),
          el('div', { class: 'row' },
            el('button', { class: 'btn green', text: '✓ Done it!', onclick: e => focusDone(e.currentTarget) }),
            el('button', { class: 'btn ghost', text: 'Stop here', onclick: () => { focusStop(false); toast('Fine to stop. You started, and that\'s logged.'); } })),
        );
        return;
      }
      actions.replaceChildren(
        el('div', { class: 'nudge', text: 'Time\'s up! How did it go?' }),
        el('button', { class: 'btn green big-done', text: '✓ Done it!', onclick: e => focusDone(e.currentTarget) }),
        el('div', { class: 'row' },
          el('button', { class: 'btn', text: '+5 min', onclick: () => startTimer(5) }),
          el('button', { class: 'btn ghost', text: '🪓 Split it', onclick: focusSplit })),
        el('button', { class: 'btn ghost', text: 'Stop for now (+3 XP for trying)', onclick: () => focusStop(true) }),
      );
      return;
    }
    tText.textContent = fmt(left);
    tSub.textContent = `of ${f.minutes} min`;
    tr.setAttribute('stroke-dashoffset', C * (1 - left / total));
    document.title = `${fmt(left)} · ${nowText}`;
  };
  actions.replaceChildren(
    el('button', { class: 'btn green big-done', text: '✓ Done!', onclick: e => focusDone(e.currentTarget) }),
    el('div', { class: 'row' },
      el('button', { class: 'btn ghost', text: '🪓 Too big', onclick: focusSplit }),
      el('button', { class: 'btn ghost', text: 'Stop', onclick: () => focusStop(false) })),
  );
  update();
  if (f.endAt > Date.now()) timerInt = setInterval(update, 250);
}

// ---------- Wins ----------
function renderWins() {
  $('#statToday').textContent = winsToday();
  $('#statStreak').textContent = currentStreak();
  $('#statStarts').textContent = startsToday();
  $('#statTotal').textContent = state.log.filter(l => l.kind !== 'start').length;
  $('#setGoal').value = state.settings.goal;
  $('#setSound').value = state.settings.sound ? '1' : '0';
  const items = state.log.slice(0, 60);
  $('#logList').replaceChildren(...(items.length ? items.map(l => el('div', { class: 'log-item' },
    el('span', { text: l.kind === 'task' ? '🏁' : l.kind === 'start' ? '🚀' : '✅' }),
    el('div', {}, el('div', { text: l.kind === 'start' ? `Started: ${l.title}` : l.title }), l.parent ? el('div', { class: 'sub', text: l.parent }) : null),
    el('span', { class: 'when', text: when(l.at) })))
    : [el('div', { class: 'empty', text: 'Your wins will show up here. Every tick counts.' })]));
}
function when(ts) {
  const d = new Date(ts);
  const time = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  if (dayKey(d) === dayKey()) return time;
  return d.toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short' });
}

// ---------- Navigation ----------
function go(v) {
  view = v;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.view === v));
  for (const name of ['tasks', 'focus', 'wins']) $('#view-' + name).hidden = name !== v;
  if (v !== 'focus') { clearInterval(timerInt); document.title = 'Tiny Wins'; }
  render();
  scrollTo(0, 0);
}
function render() {
  renderHeader();
  if (view === 'tasks') renderTasks();
  if (view === 'focus') renderFocus();
  if (view === 'wins') renderWins();
}

// ---------- Wiring ----------
document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => go(b.dataset.view)));
$('#bulkBtn').addEventListener('click', () => openBulk());
function closeSearch() {
  query = '';
  $('#searchInput').value = '';
  $('#searchBar').hidden = true;
  $('#searchBtn').hidden = false;
  render();
}
$('#searchBtn').addEventListener('click', () => {
  $('#searchBar').hidden = false;
  $('#searchBtn').hidden = true;
  $('#searchInput').focus();
});
$('#searchInput').addEventListener('input', e => { query = e.target.value; render(); });
$('#searchInput').addEventListener('keydown', e => { if (e.key === 'Escape') closeSearch(); if (e.key === 'Enter') e.target.blur(); });
$('#searchClose').addEventListener('click', closeSearch);
// Pasting several lines into the single-line box opens the list importer instead.
$('#captureInput').addEventListener('paste', e => {
  const text = (e.clipboardData || window.clipboardData).getData('text');
  if (/\n\s*\S/.test(text.trim())) { e.preventDefault(); openBulk(text); }
});
$('#captureForm').addEventListener('submit', e => {
  e.preventDefault();
  const inp = $('#captureInput');
  if (!inp.value.trim()) return;
  addTask(inp.value);
  inp.value = '';
  inp.focus();
  toast('Captured. Out of your head ✨');
});
$('#sortSelect').append(...Object.entries(SORTS).map(([k, v]) => el('option', { value: k, text: v.label })));
$('#sortSelect').value = state.settings.sort;
$('#sortSelect').addEventListener('change', e => { state.settings.sort = e.target.value; startIdx = 0; save(); render(); });
$('#setGoal').addEventListener('change', e => { state.settings.goal = Math.max(1, Math.min(20, +e.target.value || 3)); save(); renderHeader(); });
$('#setSound').addEventListener('change', e => { state.settings.sound = e.target.value === '1'; save(); });
$('#exportBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = el('a', { href: URL.createObjectURL(blob), download: `tinywins-${dayKey()}.json` });
  document.body.append(a); a.click(); a.remove();
});
$('#importBtn').addEventListener('click', () => $('#importFile').click());
$('#importFile').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!Array.isArray(data.tasks)) throw new Error();
    state = Object.assign(defaultState(), data);
    state.settings = Object.assign(defaultState().settings, state.settings);
    $('#sortSelect').value = state.settings.sort;
    save(); render(); toast('Backup restored');
  } catch { toast('That file didn\'t look like a backup'); }
  e.target.value = '';
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

go(state.focus ? 'focus' : 'tasks');
})();
</script>
</body>
